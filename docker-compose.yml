version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discodeit-app
    env_file:
      - discodeit.env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - PROJECT_NAME=${PROJECT_NAME}
      - PROJECT_VERSION=${PROJECT_VERSION}
      - JVM_OPTS=${JVM_OPTS}
      - AWS_CREDENTIALS_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_CREDENTIALS_SECRET_KEY=${AWS_S3_SECRET_KEY}
      - AWS_REGION=${AWS_S3_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_PRESIGNED_URL_EXPIRATION=${AWS_S3_PRESIGNED_URL_EXPIRATION}
    volumes:
      - ./BinaryContentStorage:/app/BinaryContentStorage
    ports:
      - "${APP_PORT}:80"
    depends_on:
      - postgres

    networks:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: discodeit-db
    env_file:
      - discodeit.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "${DB_PORT}:5432"
    networks:
      - backend

networks:
  backend:

volumes:
  db-data:
    name: discodeit-db-data
